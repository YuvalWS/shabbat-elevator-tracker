# Shabbat Elevator dashboard (YAML). Entity IDs start with the device name, here
# "example_building" for a building named "Example building": replace it with yours.
title: Shabbat Elevator
views:
  - title: Elevator
    path: elevator
    icon: mdi:elevator-passenger
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Next elevator
            icon: mdi:elevator-passenger
          - type: tile
            entity: sensor.example_building_next_arrival
            name: My floor
            icon: mdi:home-account
            grid_options: {columns: 12}
            visibility: &running
              - condition: state
                entity: binary_sensor.example_building_elevator_running
                state: "on"
          - type: entities
            visibility: *running
            entities:
              - entity: sensor.example_building_next_arrival
                name: Arrives at
                format: time
          - type: markdown
            content: >-
              **The Shabbat elevator is not running now.**
              Predictions start once it runs and the tracker has synced.
            visibility:
              - condition: state
                entity: binary_sensor.example_building_elevator_running
                state_not: "on"
          - type: tile
            entity: sensor.example_building_sync_state
            name: Sync
            grid_options: {columns: 6}
          - type: tile
            entity: sensor.example_building_last_sync
            name: Last sync
            grid_options: {columns: 6}

      - type: grid
        cards:
          - type: heading
            heading: Shabbat
            icon: mdi:candle
          - type: tile
            entity: binary_sensor.example_building_issur_melacha
            name: Issur melacha
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.example_building_shabbat_elevator_window
            name: Elevator window
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.example_building_elevator_running
            name: Elevator
            grid_options: {columns: 6}
          - type: tile
            entity: binary_sensor.example_building_audio_stream
            name: Sensor
            grid_options: {columns: 6}
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: binary_sensor.example_building_elevator_running
                name: Elevator
              - entity: binary_sensor.example_building_audio_stream
                name: Sensor
              - entity: sensor.example_building_sync_state
                name: Sync

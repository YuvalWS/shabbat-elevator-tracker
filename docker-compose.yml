# docker compose up -d
# Put your config in ./config/config.yaml (start from config.example.yaml).
services:
  shabbat-elevator-tracker:
    image: ghcr.io/yuvalws/shabbat-elevator-tracker:latest
    build: .
    container_name: shabbat-elevator-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro
      - shabbat-elevator-data:/data
    environment:
      TZ: Asia/Jerusalem
      # SET_AUDIO_SOURCE: rtsp://frigate.local:8554/doorbell_audio
      # Stream credentials (never put them in config.yaml):
      # SET_AUTH_TYPE: basic
      # SET_STREAM_USERNAME: elevator
      # SET_STREAM_PASSWORD: change-me

volumes:
  shabbat-elevator-data:
